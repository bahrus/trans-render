<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Global This</title>
</head>
<body>
    <div id=target></div>
    <script>
        var a = {b: 'c'};
    </script>
    <script type=module>
        
        import {get} from '/XV/get.js';
        
        const test = await get('globalThis://a');
        if(test.b === 'c'){
            target.setAttribute('mark', 'good');
        }
    </script>
</body>
</html>
