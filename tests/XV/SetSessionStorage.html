<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id=target></div>
    <script type=module>
        window.addEventListener('message', e => {
            console.log({e});
        });
        import {set} from '/XV/set.js';
        import {get} from '/XV/get.js';
        const test = {a: 'b'};
        sessionStorage.setItem('c', JSON.stringify(test));
        
        const test2 = await set('sessionStorage://c?.a', 'd');
        const test3 = await get('sessionStorage://c?.a');
        //console.log({test2});
        if(test3 === 'd'){
            target.setAttribute('mark', 'good');
        }
    </script>
