<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gait Session Storage</title>
</head>
<body>
    <div id=target></div>
    <script type=module>
        setTimeout(async () => {
            //const test = {a: 'b'};
            const {set} = await import('/XV/set.js');
            set('sessionStorage://c?.a', 'b');
        }, 1000);
        import {gait} from '/XV/gait.js';
        sessionStorage.removeItem('c');
        
        const test2 = await gait('sessionStorage://c?.a');
        //console.log({test2});
        if(test2 === 'b'){
            target.setAttribute('mark', 'good');
        }

    </script>
</body>
</html>
