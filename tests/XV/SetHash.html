<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Hash</title>
</head>
<body>
    <div id=target></div>
    <script type=module>
        window.addEventListener('message', e => {
            console.log({e});
        });
        import {set} from '/XV/set.js';
        import {get} from '/XV/get.js';
        
        
        await set('locationHash://msg', 'goodbye');
        const test = await get('locationHash://msg');
        if(test === 'goodbye'){
            target.setAttribute('mark', 'good');
        }
    </script>
</body>
</html>
