<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All DSS Tests</title>
</head>
<body>
    <div id=target></div>
    <script type=module>
        import {parse} from '/dss/parse.js';

        function compare(lhs, rhs){
            for(const key in lhs){
                if(lhs[key] !== rhs[key]) return false;
            }
            for(const key in rhs){
                if(lhs[key] !== rhs[key]) return false;
            }
            return true;
        }

        async function runTest(){
            const test1 = await parse('$0+ish?.handle');
            console.log({test1});
            if(!compare({self: true, host: false, ish: true, prop: 'handle'}, test1)) return;;
            
            const test2 = await parse('#abc');
            console.log({test2});
            if(!compare({self: false, host: false, ish: false, id: 'abc'}, test2)) return;

            target.setAttribute('mark', 'good');
        }
        runTest();

    </script>
</body>
</html>
