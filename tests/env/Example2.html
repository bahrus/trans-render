<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class IndexedDBWrapper {
        constructor(dbName, version) {
            this.dbName = dbName;
            this.version = version;
            this.db = null;
        }

        async openDB() {
            return new Promise((resolve, reject) => {
            const request = indexedDB.open(this.dbName, this.version);

            request.onupgradeneeded = (event) => {
                this.db = event.target.result;
                if (!this.db.objectStoreNames.contains('store')) {
                this.db.createObjectStore('store', { keyPath: 'id', autoIncrement: true });
                }
            };

            request.onsuccess = (event) => {
                this.db = event.target.result;
                resolve(this.db);
            };

            request.onerror = (event) => {
                reject(`Database error: ${event.target.errorCode}`);
            };
            });
        }

        async addData(storeName, data) {
            return new Promise((resolve, reject) => {
            const transaction = this.db.transaction([storeName], 'readwrite');
            const store = transaction.objectStore(storeName);
            const request = store.add(data);

            request.onsuccess = () => {
                resolve(request.result);
            };

            request.onerror = (event) => {
                reject(`Add error: ${event.target.errorCode}`);
            };
            });
        }

        async getData(storeName, key) {
            return new Promise((resolve, reject) => {
            const transaction = this.db.transaction([storeName]);
            const store = transaction.objectStore(storeName);
            const request = store.get(key);

            request.onsuccess = () => {
                resolve(request.result);
            };

            request.onerror = (event) => {
                reject(`Get error: ${event.target.errorCode}`);
            };
            });
        }
}

// Usage example:
(async () => {
  const dbWrapper = new IndexedDBWrapper('myDatabase', 1);
  await dbWrapper.openDB();
  await dbWrapper.addData('store', { name: 'John Doe', age: 30 });
  const data = await dbWrapper.getData('store', 1);
  console.log(data);
})();
    </script>
</body>
</html>
