<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type=module>
        import {IndexedDBWrapper} from '/env/IndexedDBWrapper.js';
        const dbWrapper = new IndexedDBWrapper('myDatabase', 1);
        
        await dbWrapper.openDB();
        
        await dbWrapper.addData('store', { name: 'John Doe', age: 30 });
        
        const idx = await dbWrapper.addData('store', { name: 'Jane Doe', age: 31 });
        
        const data1 = await dbWrapper.getData('store', 1);
        const data2 = await dbWrapper.getData('store', idx);
        const count = await dbWrapper.getCount('store');
        console.log({data1, data2, count});
    </script>
    </script>
</body>
</html>
