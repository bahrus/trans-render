<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type=module>
        import {IndexedDBWrapper} from '/env/IndexedDBWrapper.js';
        const dbWrapper = new IndexedDBWrapper('myDatabase', 'myTable', 1);
        
        await dbWrapper.openDB();
        
        await dbWrapper.addData({ name: 'John Doe', age: 30 });

        //dbWrapper.watch('store');
        const idx = await dbWrapper.addData({ name: 'Jane Doe', age: 31 });
        await dbWrapper.addData({ name: 'Jane Smith', age: 32 });
        const data1 = await dbWrapper.getRow(0);
        const data2 = await dbWrapper.getRow(idx);
        const count = await dbWrapper.getCount();
        const data3 = await dbWrapper.getRow(count - 1);
        const data4 = await dbWrapper.getLastRow();
        const data5 = await dbWrapper.getRow(-1);
        const data6 = await dbWrapper.getAllRows();
        await dbWrapper.updateRow(1, { name: 'Isaac Newton', age: 12});
        console.log({data1, data2, count, data3, data4, data5, data6});
    </script>
    </script>
</body>
</html>
