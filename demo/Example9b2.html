<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example 9b2</title>
    <script type=importmap>
        {
            "imports": {
                "mount-observer/": "/mount-observer/"
            }
        }
    </script>
    <script type=module>
        import './Example9b2.js';
    </script>
</head>
<body>
    <div>
        <table itemprop=list>
            <caption>Medal List Summer 2024</caption>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>NOC</th>
                    <th>Gold</th>
                    <th>Silver</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td itemprop=rank></td>
                    <td itemprop=noc></td>
                    <td itemprop=gold></td>
                    <td itemprop=silver></td>
                    <td itemprop=bronze></td>
                    <td><span itemprop=total></span> of <span -o=totalMedalCount></span></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
