<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const regex = /(?<!\?\.)(?<!```).(?!```)/gs;

// Function to split the text
function splitText(input) {
    return input.split(regex);
}

// Example text
const text = `
This is a sentence.
This is another sentence?. This should not split?.
Here's the final sentence.
\`\`\`
This is a period inside triple ticks.
Should be ignored.
\`\`\`
End of document.
`;

// Split the text based on the regex
const splitResult = splitText(text);

// Output the split result
console.log(splitResult);

    </script>
</body>
</html>
